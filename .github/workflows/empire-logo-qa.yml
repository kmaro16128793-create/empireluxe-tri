name: Empire logo integration QA
on:
  push:
    branches: [qa-shopify-20260913]
    paths: ['logo-qa/**', '.github/workflows/empire-logo-qa.yml']
permissions:
  contents: read
concurrency:
  group: empire-logo-qa
  cancel-in-progress: true
jobs:
  verify-logo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright pillow requests cryptography
          python -m playwright install --with-deps chromium
      - name: Capture actual header and isolated candidate
        run: python -u logo-qa/check_logo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: empire-logo-evidence-encrypted
          path: logo-qa-encrypted.bin
          retention-days: 1
