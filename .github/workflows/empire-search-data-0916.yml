name: Reference search data
on:
  push:
    branches: [qa-shopify-20260913]
    paths: ['.github/workflows/empire-search-data-0916.yml']
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - run: python -m pip install --quiet requests beautifulsoup4 cryptography
      - name: Read reference catalogue and matching search order
        run: |
          python - <<'PY'
          import requests,json,time,re,io,os,zipfile
          from bs4 import BeautifulSoup
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0';out={}
          r=s.get('https://on-cloudtilt.fr/products.json?limit=250',timeout=25);r.raise_for_status();out['products.json']=r.content
          for n in range(1,14):
              time.sleep(1)
              r=s.get('https://on-cloudtilt.fr/search',params={'q':'Cloudtilt','page':n},timeout=25)
              if r.status_code==429:break
              r.raise_for_status();out['search-'+str(n)+'.html']=r.content
              doc=BeautifulSoup(r.text,'html.parser')
              if not doc.select('.pagination .next a'):break
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:
              for name,data in out.items():z.writestr(name,data)
          key=serialization.load_pem_public_key(Path('resume-final/public.pem').read_bytes());secret=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
          wrapped=key.encrypt(secret,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          Path('search-data.bin').write_bytes(b'EQA1'+wrapped+nonce+AESGCM(secret).encrypt(nonce,buf.getvalue(),b'empire-qa'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: empire-search-data
          path: search-data.bin
          retention-days: 7
