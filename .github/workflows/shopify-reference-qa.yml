name: Shopify reference QA
on:
  push:
    branches: [qa-shopify-20260913]
    paths: ['qa/**', '.github/workflows/shopify-reference-qa.yml']
permissions:
  contents: read
concurrency:
  group: shopify-reference-qa
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Install verification tools
        run: |
          python -m pip install --quiet playwright pillow beautifulsoup4 requests cryptography
          python -m playwright install --with-deps chromium
      - name: Compare read-only storefront previews
        run: python -u qa/verify_shopify.py
      - name: Encrypt verification evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, zipfile, os
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public = b'''-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApzXZGEYoBevSxcia9Gaf
          nccEzqV07JoD4G8iJPI84CCOVWupGJ2OtKnHlVMyqs35dhenSVqzoUYzSyB5a6Ym
          kwT4nzJlH1wPE5QlRcx1yNIdL6LO3cRRRlQbJ/2MvIE8mUnCDdFuHtqGaGOv/zpK
          Im9Mh9cEKHeLgRiUcmN03T2k8BI5xVxu9bcy7ywUOI3N0bw4yhUsyWTVeubbXKZg
          LMPmPjmhzMo2Sar13SOeTPnPF50iym2Cwwafu+Riw0Cxyz/JbnxVSIihpMOD8W8Y
          Q0zwyENUyG3kPrLmz9Tlho22YExMdukM6po08sEb29Zhc+s+JKgjXI1qbTSQWnhV
          6QIDAQAB
          -----END PUBLIC KEY-----'''
          key=serialization.load_pem_public_key(public)
          buf=io.BytesIO()
          with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              for p in Path('qa-evidence').rglob('*'):
                  if p.is_file():archive.write(p,str(p.relative_to('qa-evidence')))
          secret=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
          encrypted_key=key.encrypt(secret,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          payload=b'EQA1'+encrypted_key+nonce+AESGCM(secret).encrypt(nonce,buf.getvalue(),b'empire-qa')
          Path('shopify-qa-encrypted.bin').write_bytes(payload)
          print('Encrypted evidence ready')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopify-qa-encrypted
          path: shopify-qa-encrypted.bin
          retention-days: 1
